name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Placeholder check. EP07 (atlex-connect) replaces it with terraform fmt -check + terraform validate."

  tf-report:
    name: atlex-tf-report
    runs-on: ubuntu-latest
    # The official Python image, not setup-python: hosted runners drop builds of older versions, and
    # the oldest one the script supports is the one worth testing.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the script supports, and a current one.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tf-report/tests -v
