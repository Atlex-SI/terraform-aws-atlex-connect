name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Placeholder check. EP07 (atlex-connect) replaces it with terraform fmt -check + terraform validate."

  tf-report:
    name: atlex-tf-report
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Python the script supports, and a current one.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 -m unittest discover -s tf-report/tests -v
